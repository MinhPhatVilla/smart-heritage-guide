services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-heritage-guide-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - ./uploads:/app/uploads
      - ./local_dev.db:/app/local_dev.db
    restart: unless-stopped
